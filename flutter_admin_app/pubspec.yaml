name: ssmart_pos_admin
description: iOS Admin Dashboard for SSmart POS - Real-time sales monitoring and analytics
publish_to: 'none'
version: 2.4.0+37

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.10.0
  firebase_database: ^12.4.2
  firebase_auth: ^6.5.2

  # Google Sign-In (owner master login) — v7 API: initialize() + authenticate()
  google_sign_in: ^7.2.0

  # State Management
  provider: ^6.1.1

  # Charts & Visualization
  fl_chart: ^1.2.0

  # UI & Theming
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.0
  image_picker: ^1.1.2

  # Loading indicators
  shimmer: ^3.0.0

  # PDF statements & sharing
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^11.0.0
  path_provider: ^2.1.4
  device_info_plus: ^11.2.0

  # Device fingerprint hashing (SHA-256) for license activation
  crypto: ^3.0.3

  # Offline Ed25519 product-key verification (matches desktop licensing)
  cryptography: ^2.7.0

  # Encrypted license storage (Android keystore / iOS keychain)
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
