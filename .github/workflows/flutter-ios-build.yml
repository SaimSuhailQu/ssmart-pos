name: Build Flutter iOS Admin App

# ============================================================================
# WORKFLOW TRIGGERS
# ============================================================================
# This workflow builds the iOS IPA for the Flutter admin app
# Triggers:
#   1. Push to tags matching 'flutter-v*' (e.g., flutter-v1.0.0)
#   2. Manual dispatch from GitHub Actions UI
# ============================================================================

on:
  push:
    tags:
      - 'flutter-v*'  # Example: flutter-v1.0.0, flutter-v1.0.1
  workflow_dispatch:   # Allows manual trigger
    inputs:
      build_type:
        description: 'Build type (unsigned = development, no Apple account needed | signed = production with code signing)'
        required: true
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned
      deploy_to_testflight:
        description: 'Deploy to TestFlight after build? (only for signed builds)'
        required: false
        type: boolean
        default: false
      build_number_override:
        description: 'Override build number (optional)'
        required: false
        type: string

permissions:
  contents: write  # Required for creating releases and uploading artifacts

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
env:
  FLUTTER_VERSION: '3.41.7'  # Update to match your project's Flutter version
  XCODE_VERSION: '15.2'      # Xcode version on macos-latest
  WORKING_DIRECTORY: flutter_admin_app

# ============================================================================
# JOBS
# ============================================================================
jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ========================================================================
      # STEP 1: Checkout Repository
      # ========================================================================
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0  # Fetch all history for version tagging

      # ========================================================================
      # STEP 1.5: Determine Build Configuration
      # ========================================================================
      - name: Determine Build Configuration
        id: build_config
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          INPUT_BUILD_NUMBER_OVERRIDE: ${{ github.event.inputs.build_number_override }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          HAS_SIGNING_SECRETS: ${{ secrets.MATCH_PASSWORD }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Determining Build Configuration"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # 1. Determine Build Type (signed or unsigned)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ -n "$HAS_SIGNING_SECRETS" ]; then
              echo "type=signed" >> $GITHUB_OUTPUT
              echo "Building SIGNED release from tag"
            else
              echo "type=unsigned" >> $GITHUB_OUTPUT
              echo "Building UNSIGNED release from tag (no signing secrets found)"
            fi
          else
            BUILD_TYPE="${INPUT_BUILD_TYPE:-unsigned}"
            echo "type=$BUILD_TYPE" >> $GITHUB_OUTPUT
            echo "Building $BUILD_TYPE build"
          fi

          # 2. Determine Build Name (SemVer compatible version)
          if [[ "$GITHUB_REF" == refs/tags/flutter-v* ]]; then
            # Extract version from tag (e.g., flutter-v1.0.0 -> 1.0.0)
            VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/flutter-v//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          else
            # Default fallback for branch/manual builds
            echo "version=1.0.0" >> $GITHUB_OUTPUT
            echo "Using default fallback version: 1.0.0"
          fi

          # 3. Determine Build Number (Integer)
          if [ -n "$INPUT_BUILD_NUMBER_OVERRIDE" ]; then
            echo "build_number=$INPUT_BUILD_NUMBER_OVERRIDE" >> $GITHUB_OUTPUT
            echo "Using overridden build number: $INPUT_BUILD_NUMBER_OVERRIDE"
          else
            echo "build_number=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
            echo "Using build number from run number: $GITHUB_RUN_NUMBER"
          fi
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ========================================================================
      # STEP 2: Setup Flutter
      # ========================================================================
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}'
          cache-path: '${{ runner.tool_cache }}/flutter'

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      # ========================================================================
      # STEP 3: Setup Ruby and Bundler for Fastlane
      # ========================================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ env.WORKING_DIRECTORY }}/ios/fastlane

      - name: Verify Bundler Installation
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios/fastlane
        run: |
          echo "Ruby version: $(ruby --version)"
          echo "Bundler version: $(bundle --version)"
          echo "Gemfile location: $(pwd)/Gemfile"

      # ========================================================================
      # STEP 4: Configure Environment (Firebase Configuration)
      # ========================================================================
      # This step creates the .env file using the GoogleService-Info.plist file:
      #
      # GoogleService-Info.plist
      #   - Add secret: GOOGLE_SERVICE_INFO_PLIST (base64-encoded plist)
      #   - How to create: cat GoogleService-Info.plist | base64
      #
      # For unsigned builds: Firebase is OPTIONAL (can test without backend)
      # For signed builds: Firebase is RECOMMENDED (for full functionality)
      #
      # See flutter_admin_app/GITHUB_SECRETS_SETUP.md for complete setup guide
      # ========================================================================

      - name: Setup Firebase Configuration (GoogleService-Info.plist)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          BUILD_TYPE: ${{ steps.build_config.outputs.type }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Firebase Configuration Setup"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "✓ Using GoogleService-Info.plist from GitHub Secrets"
            echo ""

            # Clean base64 string (remove only newlines and carriage returns) and decode
            # This handles both single-line and multi-line base64 input
            # Note: We preserve spaces as they may be valid base64 padding
            echo "$GOOGLE_SERVICE_INFO_PLIST" | tr -d '\n\r' | base64 --decode > temp-plist.xml

            if [ $? -eq 0 ] && [ -f temp-plist.xml ] && [ -s temp-plist.xml ]; then
              echo "✓ Successfully decoded plist file ($(wc -c < temp-plist.xml) bytes)"
              echo "  Running setup_from_plist.sh script..."
              echo ""

              # Make script executable and run it
              chmod +x scripts/setup_from_plist.sh
              if ./scripts/setup_from_plist.sh temp-plist.xml; then
                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "✓ Firebase configured successfully via GoogleService-Info.plist"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              else
                echo "✗ Failed to setup from plist file"
                rm -f temp-plist.xml
                exit 1
              fi

              # Cleanup
              rm -f temp-plist.xml
            else
              echo "✗ Failed to decode base64 plist"
              echo "  The GOOGLE_SERVICE_INFO_PLIST secret may be corrupted or invalid"
              rm -f temp-plist.xml
              exit 1
            fi
          else
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  No Firebase Configuration Found"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "No GOOGLE_SERVICE_INFO_PLIST secret configured in GitHub Secrets."
            echo ""
            
            # Create placeholder GoogleService-Info.plist (needed for Xcode compilation)
            echo "Creating placeholder GoogleService-Info.plist..."
            mkdir -p ios/Runner
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>API_KEY</key>'
              echo '  <string>placeholder-api-key</string>'
              echo '  <key>GCM_SENDER_ID</key>'
              echo '  <string>123456789012</string>'
              echo '  <key>PLIST_VERSION</key>'
              echo '  <string>1</string>'
              echo '  <key>BUNDLE_ID</key>'
              echo '  <string>com.ssmartpos</string>'
              echo '  <key>PROJECT_ID</key>'
              echo '  <string>placeholder-project-id</string>'
              echo '  <key>STORAGE_BUCKET</key>'
              echo '  <string>placeholder-project-id.appspot.com</string>'
              echo '  <key>IS_ADS_ENABLED</key>'
              echo '  <false/>'
              echo '  <key>IS_ANALYTICS_ENABLED</key>'
              echo '  <false/>'
              echo '  <key>IS_APPINVITE_ENABLED</key>'
              echo '  <false/>'
              echo '  <key>IS_GCM_ENABLED</key>'
              echo '  <true/>'
              echo '  <key>IS_SIGNIN_ENABLED</key>'
              echo '  <false/>'
              echo '  <key>GOOGLE_APP_ID</key>'
              echo '  <string>1:123456789012:ios:1234567890123456</string>'
              echo '  <key>DATABASE_URL</key>'
              echo '  <string>https://placeholder-project-id-default-rtdb.firebaseio.com</string>'
              echo '</dict>'
              echo '</plist>'
            } > ios/Runner/GoogleService-Info.plist
            echo "✓ Placeholder GoogleService-Info.plist created"

            # Create placeholder .env for builds without Firebase
            if [ "$BUILD_TYPE" == "unsigned" ]; then
              echo "Creating placeholder .env for unsigned build..."
              cp .env.example .env || echo "# Placeholder .env for build" > .env
              echo "✓ Placeholder .env created"
            else
              echo "⚠ WARNING: Signed build without Firebase configuration"
              echo "  App will build but Firebase features won't work"
              echo ""
              cp .env.example .env || echo "# Placeholder .env for build" > .env
            fi
          fi

          echo ""
          echo "Environment setup complete"

      # ========================================================================
      # STEP 5: Install Flutter Dependencies
      # ========================================================================
      - name: Get Flutter Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: flutter pub get

      - name: Run Code Generation (if needed)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # Uncomment if you use build_runner or other code generation
          # flutter pub run build_runner build --delete-conflicting-outputs
          echo "Skipping code generation"

      # ========================================================================
      # STEP 7: Install Apple Certificate & Provisioning Profile (Signed Build only)
      # ========================================================================
      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_TYPE: ${{ steps.build_config.outputs.type }}
        run: |
          if [ "$BUILD_TYPE" != "signed" ] || [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No iOS signing secrets found or unsigned build requested. Proceeding with unsigned build..."
            echo "SIGNED_BUILD=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "SIGNED_BUILD=true" >> $GITHUB_ENV
          
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH
          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          # import certificate to keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          # uuid extraction
          UUID=$(security cms -D -i $PP_PATH | grep -A1 UUID | grep string | sed -E 's/<\/?string>//g' | xargs)
          echo "Provisioning Profile UUID: $UUID"
          # copy provisioning profile to proper system directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      # ========================================================================
      # STEP 7.5: Generate iOS Flutter Configuration
      # ========================================================================
      - name: Generate iOS Flutter Configuration
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "Cleaning Flutter iOS build artifacts..."
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ios/Pods
          rm -rf build/
          
          echo "Running flutter clean..."
          flutter clean
          
          echo "Getting dependencies..."
          flutter pub get
          
          echo "Generating iOS Flutter configuration files..."
          flutter precache --ios
          
          echo "Building iOS framework (config-only)..."
          flutter build ios --config-only --no-codesign --debug 2>&1 || true
          
          echo "Verifying Flutter framework files..."
          if [ -f "ios/Flutter/Flutter.podspec" ]; then
            echo "✓ Flutter.podspec found"
          else
            echo "✗ Flutter.podspec missing - running pod install to generate"
          fi
          
          echo "✓ Flutter iOS configuration complete"

      # ========================================================================
      # STEP 8: Install CocoaPods Dependencies
      # ========================================================================
      - name: Install CocoaPods Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: |
          pod install --repo-update

      # ========================================================================
      # STEP 9: Build Flutter iOS App (Signed or Unsigned fallback)
      # ========================================================================
      - name: Build iOS Application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          BUILD_VERSION: ${{ steps.build_config.outputs.version }}
          BUILD_NUMBER: ${{ steps.build_config.outputs.build_number }}
        run: |
          if [ "$SIGNED_BUILD" = "true" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  SIGNED PRODUCTION BUILD"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            
            # Replace YOUR_TEAM_ID placeholder in ExportOptions.plist with actual Team ID
            if [ -n "$FASTLANE_TEAM_ID" ]; then
              echo "Replacing YOUR_TEAM_ID placeholder in ExportOptions.plist with actual Team ID..."
              sed -i.bak "s/YOUR_TEAM_ID/$FASTLANE_TEAM_ID/g" ios/ExportOptions.plist
            else
              echo "⚠ WARNING: FASTLANE_TEAM_ID is not set. Proceeding without modification."
            fi
            
            # Build IPA using Flutter (passing DEVELOPMENT_TEAM as xcodebuild setting override)
            flutter build ipa \
              --release \
              --export-options-plist=ios/ExportOptions.plist \
              --build-name="$BUILD_VERSION" \
              --build-number="$BUILD_NUMBER" \
              DEVELOPMENT_TEAM="$FASTLANE_TEAM_ID"
              
            # Verify build output
            ls -lh build/ios/ipa/
          else
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  UNSIGNED DEVELOPMENT BUILD"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            
            # Build for simulator (useful for testing on macs)
            flutter build ios --simulator --debug
            
            # Build for physical device
            flutter build ios --release --no-codesign
            
            # Package into an IPA manually
            echo "Packaging unsigned .app into .ipa..."
            mkdir -p build/ios/iphoneos
            mkdir -p Payload
            cp -R build/ios/iphoneos/Runner.app Payload/
            zip -rq build/ios/iphoneos/ssmartpos.ipa Payload
            rm -rf Payload
            echo "Unsigned IPA generated successfully!"
            
            # Copy to expected output directory
            mkdir -p build/ios/ipa
            cp build/ios/iphoneos/ssmartpos.ipa build/ios/ipa/
          fi

      # ========================================================================
      # STEP 10: Upload to TestFlight (Signed Builds Only)
      # ========================================================================
      - name: Upload to TestFlight
        if: |
          steps.build_config.outputs.type == 'signed' &&
          (github.event.inputs.deploy_to_testflight == 'true' || startsWith(github.ref, 'refs/tags/flutter-v'))
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios/fastlane
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          bundle exec fastlane beta

      # ========================================================================
      # STEP 11: Upload Build Artifacts
      # ========================================================================

      # Upload unsigned .app bundle
      - name: Upload Unsigned App Artifact
        if: steps.build_config.outputs.type == 'unsigned'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: SSmart-POS-Admin-iOS-Unsigned-${{ steps.build_config.outputs.build_number }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/build/ios/Debug-iphonesimulator/*.app
            ${{ env.WORKING_DIRECTORY }}/build/ios/iphoneos/*.ipa
          retention-days: 30
          if-no-files-found: error

      # Upload signed IPA
      - name: Upload Signed IPA Artifact
        if: steps.build_config.outputs.type == 'signed'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: SSmart-POS-Admin-iOS-Signed-${{ steps.build_config.outputs.version }}-${{ steps.build_config.outputs.build_number }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/build/ios/ipa/*.ipa
            ${{ env.WORKING_DIRECTORY }}/build/ios/ipa/*.dSYM.zip
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@a74c6b72af54cfa997e81df42d94703d6313a2d0 # v2.0.6
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/flutter-v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/flutter-v') && github.ref_name || 'Latest Release Build' }}
          files: |
            ${{ env.WORKING_DIRECTORY }}/build/ios/ipa/*.ipa
            ${{ env.WORKING_DIRECTORY }}/build/ios/iphoneos/*.ipa
          body: |
            ## SSmart POS Admin - iOS Build (${{ steps.build_config.outputs.type == 'signed' && 'SIGNED' || 'UNSIGNED' }})

            **Version:** ${{ steps.build_config.outputs.version }}
            **Build Number:** ${{ steps.build_config.outputs.build_number }}
            **Build Type:** ${{ steps.build_config.outputs.type == 'signed' && 'Production (Signed)' || 'Development (Unsigned)' }}
            **Built:** ${{ github.event.head_commit.timestamp }}

            ### Installation Instructions

            1. **TestFlight (Recommended)**
               - If deployed to TestFlight, install via TestFlight app
               - Join the beta: [TestFlight Link]

            2. **Manual Sideloading (Unsigned builds)**
               - Download the unsigned IPA file
               - Sideload using AltStore or Sideloadly

            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/flutter-v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # STEP 13: Cleanup
      # ========================================================================
      - name: Cleanup Keychain
        if: always() && steps.build_config.outputs.type == 'signed'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

# ============================================================================
# BUILD TYPES
# ============================================================================
# This workflow supports TWO build types:
#
# 1. UNSIGNED (Development) - DEFAULT
#    - No Apple Developer account needed
#    - No code signing certificates required
#    - Works on iOS Simulator
#    - Can be installed locally via Xcode
#    - Perfect for development and testing
#    - Cannot be distributed to devices or TestFlight
#
# 2. SIGNED (Production)
#    - Requires Apple Developer account ($99/year)
#    - Needs code signing setup with Fastlane Match
#    - Produces App Store ready IPA
#    - Can be uploaded to TestFlight
#    - Required for distribution
#
# ============================================================================
# UNSIGNED BUILD USAGE (No Apple Account)
# ============================================================================
# To build unsigned development builds:
#
# 1. Go to Actions tab → Build Flutter iOS Admin App
# 2. Click "Run workflow"
# 3. Select "unsigned" as build type
# 4. Click "Run workflow"
# 5. Download .app artifact when complete
# 6. Use with iOS Simulator locally
#
# No secrets or configuration needed!
#
# Local unsigned builds:
#   cd flutter_admin_app
#   flutter build ios --simulator
#
# ============================================================================
# REQUIRED GITHUB SECRETS (For SIGNED Builds Only)
# ============================================================================
# Only configure these if you have an Apple Developer account and want
# production builds. Skip this section for unsigned development builds.
#
# Configure these secrets in: Repository Settings > Secrets and variables > Actions
#
# 1. APPLE DEVELOPER ACCOUNT
#    - FASTLANE_USER: Your Apple ID email
#    - FASTLANE_TEAM_ID: Your Apple Developer Team ID
#    - FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: App-specific password
#    - FASTLANE_SESSION: (Optional) Pre-authenticated session cookie
#
# 2. FASTLANE MATCH (CODE SIGNING)
#    - MATCH_PASSWORD: Encryption password for Match certificates
#    - MATCH_GIT_URL: URL of private Git repo for certificates
#    - MATCH_GIT_BASIC_AUTH: Base64 encoded "username:personal_access_token"
#    - MATCH_KEYCHAIN_NAME: Name for temporary keychain (e.g., "fastlane_keychain")
#    - MATCH_KEYCHAIN_PASSWORD: Password for temporary keychain
#
# 3. FIREBASE CONFIGURATION (Optional for unsigned, recommended for signed)
#    - GOOGLE_SERVICE_INFO_PLIST: Base64-encoded plist file
#    - Create: cat GoogleService-Info.plist | base64
#
#    See: flutter_admin_app/GITHUB_SECRETS_SETUP.md for complete setup guide
#
# ============================================================================
# SETUP GUIDES
# ============================================================================
# UNSIGNED (Development):
#   See: flutter_admin_app/IOS_BUILD_SETUP.md → "Building Without Apple Developer Account"
#
# SIGNED (Production):
#   See: flutter_admin_app/IOS_BUILD_SETUP.md → Complete setup guide
#
# Quick start for SIGNED builds:
# 1. Set up Apple Developer account ($99/year)
# 2. Create App ID in Apple Developer Portal
# 3. Initialize Fastlane Match: `cd ios && bundle exec fastlane match init`
# 4. Configure GitHub Secrets (see above)
# 5. Push a tag: `git tag flutter-v1.0.0 && git push origin flutter-v1.0.0`
# ============================================================================
