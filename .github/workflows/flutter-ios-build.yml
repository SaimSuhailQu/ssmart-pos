name: Build Flutter iOS Admin App

# ============================================================================
# WORKFLOW TRIGGERS
# ============================================================================
# This workflow builds the iOS IPA for the Flutter admin app
# Triggers:
#   1. Push to tags matching 'flutter-v*' (e.g., flutter-v1.0.0)
#   2. Manual dispatch from GitHub Actions UI
# ============================================================================

on:
  push:
    tags:
      - 'flutter-v*'  # Example: flutter-v1.0.0, flutter-v1.0.1
  workflow_dispatch:   # Allows manual trigger
    inputs:
      build_type:
        description: 'Build type (unsigned = development, no Apple account needed | signed = production with code signing)'
        required: true
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned
      deploy_to_testflight:
        description: 'Deploy to TestFlight after build? (only for signed builds)'
        required: false
        type: boolean
        default: false
      build_number_override:
        description: 'Override build number (optional)'
        required: false
        type: string

permissions:
  contents: write  # Required for creating releases and uploading artifacts

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
env:
  FLUTTER_VERSION: '3.24.0'  # Update to match your project's Flutter version
  XCODE_VERSION: '15.2'      # Xcode version on macos-latest
  WORKING_DIRECTORY: flutter_admin_app

# ============================================================================
# JOBS
# ============================================================================
jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ========================================================================
      # STEP 1: Checkout Repository
      # ========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version tagging

      # ========================================================================
      # STEP 2: Setup Flutter
      # ========================================================================
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}'
          cache-path: '${{ runner.tool_cache }}/flutter'

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      # ========================================================================
      # STEP 3: Setup Ruby and Bundler for Fastlane
      # ========================================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ env.WORKING_DIRECTORY }}/ios

      - name: Install Bundler Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      # ========================================================================
      # STEP 4: Configure Environment (Firebase Configuration)
      # ========================================================================
      # This step creates the .env file using one of THREE methods (in priority order):
      #
      # METHOD 1 (RECOMMENDED): GoogleService-Info.plist
      #   - Add secret: GOOGLE_SERVICE_INFO_PLIST (base64-encoded plist)
      #   - Fastest, no API calls needed
      #   - How to create: cat GoogleService-Info.plist | base64
      #
      # METHOD 2: GCP Service Account Key
      #   - Add secret: GCP_SA_KEY (JSON service account key)
      #   - Programmatic access via gcloud
      #   - Requires gcloud CLI and Firebase Admin permissions
      #
      # METHOD 3 (FALLBACK): Individual Firebase Secrets
      #   - Add 8 separate secrets (legacy method)
      #   - FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, etc.
      #   - More tedious but maximum control
      #
      # For unsigned builds: Firebase is OPTIONAL (can test without backend)
      # For signed builds: Firebase is RECOMMENDED (for full functionality)
      #
      # See flutter_admin_app/GITHUB_SECRETS_SETUP.md for complete setup guide
      # ========================================================================

      - name: Setup Firebase Configuration (Three-Tier Approach)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Firebase Configuration Setup"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # METHOD 1: GoogleService-Info.plist (RECOMMENDED - Fastest & Simplest)
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "✓ Using GoogleService-Info.plist from GitHub Secrets (Method 1 - Recommended)"
            echo ""
            echo "This is the fastest method with no API calls required."
            echo ""

            # Decode base64 plist and save to temporary file
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > temp-plist.xml

            if [ $? -eq 0 ] && [ -f temp-plist.xml ]; then
              echo "✓ Successfully decoded plist file"
              echo "  Running setup_from_plist.sh script..."
              echo ""

              # Make script executable and run it
              chmod +x scripts/setup_from_plist.sh
              if ./scripts/setup_from_plist.sh temp-plist.xml; then
                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "✓ Firebase configured successfully via GoogleService-Info.plist"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              else
                echo "✗ Failed to setup from plist file"
                exit 1
              fi

              # Cleanup
              rm -f temp-plist.xml
            else
              echo "✗ Failed to decode base64 plist"
              rm -f temp-plist.xml
              exit 1
            fi

          # METHOD 2: GCP Service Account Key (Alternative)
          elif [ -n "$GCP_SA_KEY" ]; then
            echo "✓ Using GCP Service Account key from GitHub Secrets (Method 2)"
            echo ""
            echo "This method uses gcloud CLI to retrieve Firebase configuration."
            echo ""

            # Save service account key to temporary file
            echo "$GCP_SA_KEY" > gcp-key.json

            if [ -f gcp-key.json ]; then
              echo "✓ Service account key saved"
              echo "  Running setup_from_gcp_sa.sh script..."
              echo ""

              # Make script executable and run it
              chmod +x scripts/setup_from_gcp_sa.sh
              if ./scripts/setup_from_gcp_sa.sh gcp-key.json; then
                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "✓ Firebase configured successfully via GCP Service Account"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              else
                echo "✗ Failed to setup from GCP service account"
                rm -f gcp-key.json
                exit 1
              fi

              # Cleanup
              rm -f gcp-key.json
            else
              echo "✗ Failed to save service account key"
              exit 1
            fi

          # METHOD 3: Individual Firebase Secrets (Legacy Fallback)
          elif [ -n "$FIREBASE_API_KEY" ]; then
            echo "✓ Using individual Firebase secrets from GitHub Secrets (Method 3 - Legacy)"
            echo ""
            echo "Consider switching to Method 1 (GoogleService-Info.plist) for simpler setup."
            echo ""

            # Create .env file from individual GitHub Secrets
            cat > .env << 'EOF'
          # Firebase Configuration
          # Auto-generated from GitHub Secrets on ${{ github.event.head_commit.timestamp }}

          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          EOF

            echo "✓ Environment file created from individual secrets"
            echo "  File size: $(wc -c < .env) bytes"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✓ Firebase configured successfully via individual secrets"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # NO FIREBASE SECRETS CONFIGURED
          else
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  No Firebase Configuration Found"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "No Firebase secrets are configured in GitHub Secrets."
            echo ""
            echo "CONFIGURATION OPTIONS (in priority order):"
            echo ""
            echo "  1. GoogleService-Info.plist (RECOMMENDED - Easiest)"
            echo "     → Add secret: GOOGLE_SERVICE_INFO_PLIST"
            echo "     → Value: cat GoogleService-Info.plist | base64"
            echo "     → Fastest, no API calls, single secret"
            echo ""
            echo "  2. GCP Service Account Key (Alternative)"
            echo "     → Add secret: GCP_SA_KEY"
            echo "     → Value: Contents of service account JSON key"
            echo "     → Requires Firebase Admin permissions"
            echo ""
            echo "  3. Individual Firebase Secrets (Legacy)"
            echo "     → Add 8 separate secrets (FIREBASE_API_KEY, etc.)"
            echo "     → More tedious but maximum control"
            echo ""
            echo "BUILD OPTIONS:"
            echo "  • UNSIGNED BUILDS (Development):"
            echo "    → Firebase is optional - app will build without backend"
            echo "    → Continue with build (no action needed)"
            echo ""
            echo "  • SIGNED BUILDS (Production):"
            echo "    → Firebase recommended for full functionality"
            echo "    → See: flutter_admin_app/GITHUB_SECRETS_SETUP.md"
            echo ""

            # Create placeholder .env for builds without Firebase
            if [ "${{ steps.build_type.outputs.type }}" == "unsigned" ]; then
              echo "Creating placeholder .env for unsigned build..."
              cp .env.example .env || echo "# Placeholder .env for build" > .env
              echo "✓ Placeholder .env created"
            else
              echo "⚠ WARNING: Signed build without Firebase configuration"
              echo "  App will build but Firebase features won't work"
              echo ""
              cp .env.example .env || echo "# Placeholder .env for build" > .env
            fi
          fi

          echo ""
          echo "Environment setup complete"

      # ========================================================================
      # STEP 5: Install Flutter Dependencies
      # ========================================================================
      - name: Get Flutter Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: flutter pub get

      - name: Run Code Generation (if needed)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # Uncomment if you use build_runner or other code generation
          # flutter pub run build_runner build --delete-conflicting-outputs
          echo "Skipping code generation"

      # ========================================================================
      # STEP 6: Determine Build Type
      # ========================================================================
      - name: Determine Build Type
        id: build_type
        run: |
          # For tagged builds, always use signed
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "type=signed" >> $GITHUB_OUTPUT
            echo "Building SIGNED release from tag"
          else
            # For manual dispatch, use the selected option
            echo "type=${{ github.event.inputs.build_type || 'unsigned' }}" >> $GITHUB_OUTPUT
            echo "Building ${{ github.event.inputs.build_type || 'unsigned' }} build"
          fi

      # ========================================================================
      # STEP 7: Setup iOS Code Signing (SIGNED BUILDS ONLY)
      # ========================================================================
      # For unsigned builds: Skip this entire section
      # For signed builds: Requires Apple Developer account and Fastlane Match
      # ========================================================================

      - name: Configure Keychain
        if: steps.build_type.outputs.type == 'signed'
        env:
          MATCH_KEYCHAIN_NAME: ${{ secrets.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          # Create a custom keychain for code signing
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$MATCH_KEYCHAIN_NAME"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"

          # Set the custom keychain as the default
          security list-keychains -d user -s "$MATCH_KEYCHAIN_NAME" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$MATCH_KEYCHAIN_NAME"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"

      - name: Setup Code Signing with Fastlane Match
        if: steps.build_type.outputs.type == 'signed'
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          MATCH_KEYCHAIN_NAME: ${{ secrets.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          bundle exec fastlane run sync_code_signing

      # ========================================================================
      # STEP 8: Install CocoaPods Dependencies
      # ========================================================================
      - name: Install CocoaPods Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: |
          pod install --repo-update

      # ========================================================================
      # STEP 9: Build Flutter iOS App
      # ========================================================================

      # UNSIGNED BUILD - Development/Testing (No Apple Account Required)
      - name: Build Unsigned Development App
        if: steps.build_type.outputs.type == 'unsigned'
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  UNSIGNED DEVELOPMENT BUILD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "This is an UNSIGNED development build that:"
          echo "  ✓ Works on iOS Simulator"
          echo "  ✓ Can be installed locally via Xcode"
          echo "  ✗ Cannot be distributed or installed on devices without Xcode"
          echo "  ✗ Not suitable for TestFlight or App Store"
          echo ""
          echo "For production builds, use 'signed' build type with Apple Developer account."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          bundle exec fastlane build_unsigned

      # SIGNED BUILD - Production (Requires Apple Developer Account)
      - name: Build Signed IPA
        if: steps.build_type.outputs.type == 'signed'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: ${{ secrets.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  SIGNED PRODUCTION BUILD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Building signed IPA for App Store distribution..."
          echo ""

          # Build IPA using Flutter
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name="${{ github.ref_name }}" \
            --build-number="${{ github.run_number }}"

          # Verify build output
          ls -lh build/ios/ipa/

      # ========================================================================
      # STEP 10: Upload to TestFlight (Signed Builds Only)
      # ========================================================================
      - name: Upload to TestFlight
        if: |
          steps.build_type.outputs.type == 'signed' &&
          (github.event.inputs.deploy_to_testflight == 'true' || startsWith(github.ref, 'refs/tags/flutter-v'))
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          bundle exec fastlane beta

      # ========================================================================
      # STEP 11: Upload Build Artifacts
      # ========================================================================

      # Upload unsigned .app bundle
      - name: Upload Unsigned App Artifact
        if: steps.build_type.outputs.type == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: SSmart-POS-Admin-iOS-Unsigned-${{ github.run_number }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/build/ios/Debug-iphonesimulator/*.app
          retention-days: 30
          if-no-files-found: error

      # Upload signed IPA
      - name: Upload Signed IPA Artifact
        if: steps.build_type.outputs.type == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: SSmart-POS-Admin-iOS-Signed-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/build/ios/ipa/*.ipa
            ${{ env.WORKING_DIRECTORY }}/build/ios/ipa/*.dSYM.zip
          retention-days: 30
          if-no-files-found: error

      # ========================================================================
      # STEP 12: Create GitHub Release (for tagged builds)
      # ========================================================================
      - name: Create GitHub Release (Signed Builds)
        if: startsWith(github.ref, 'refs/tags/flutter-v') && steps.build_type.outputs.type == 'signed'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WORKING_DIRECTORY }}/build/ios/ipa/*.ipa
          body: |
            ## SSmart POS Admin - iOS Build (SIGNED)

            **Version:** ${{ github.ref_name }}
            **Build Number:** ${{ github.run_number }}
            **Build Type:** Production (Signed)
            **Built:** ${{ github.event.head_commit.timestamp }}

            ### Installation Instructions

            1. **TestFlight (Recommended)**
               - If deployed to TestFlight, install via TestFlight app
               - Join the beta: [TestFlight Link]

            2. **Manual Installation (Advanced)**
               - Download the IPA file
               - Install using Xcode or a third-party tool like iOS App Signer
               - Requires a valid provisioning profile

            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # STEP 13: Cleanup
      # ========================================================================
      - name: Cleanup Keychain
        if: always() && steps.build_type.outputs.type == 'signed'
        run: |
          security delete-keychain "${{ secrets.MATCH_KEYCHAIN_NAME }}" || true

# ============================================================================
# BUILD TYPES
# ============================================================================
# This workflow supports TWO build types:
#
# 1. UNSIGNED (Development) - DEFAULT
#    - No Apple Developer account needed
#    - No code signing certificates required
#    - Works on iOS Simulator
#    - Can be installed locally via Xcode
#    - Perfect for development and testing
#    - Cannot be distributed to devices or TestFlight
#
# 2. SIGNED (Production)
#    - Requires Apple Developer account ($99/year)
#    - Needs code signing setup with Fastlane Match
#    - Produces App Store ready IPA
#    - Can be uploaded to TestFlight
#    - Required for distribution
#
# ============================================================================
# UNSIGNED BUILD USAGE (No Apple Account)
# ============================================================================
# To build unsigned development builds:
#
# 1. Go to Actions tab → Build Flutter iOS Admin App
# 2. Click "Run workflow"
# 3. Select "unsigned" as build type
# 4. Click "Run workflow"
# 5. Download .app artifact when complete
# 6. Use with iOS Simulator locally
#
# No secrets or configuration needed!
#
# Local unsigned builds:
#   cd flutter_admin_app
#   flutter build ios --simulator
#
# ============================================================================
# REQUIRED GITHUB SECRETS (For SIGNED Builds Only)
# ============================================================================
# Only configure these if you have an Apple Developer account and want
# production builds. Skip this section for unsigned development builds.
#
# Configure these secrets in: Repository Settings > Secrets and variables > Actions
#
# 1. APPLE DEVELOPER ACCOUNT
#    - FASTLANE_USER: Your Apple ID email
#    - FASTLANE_TEAM_ID: Your Apple Developer Team ID
#    - FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: App-specific password
#    - FASTLANE_SESSION: (Optional) Pre-authenticated session cookie
#
# 2. FASTLANE MATCH (CODE SIGNING)
#    - MATCH_PASSWORD: Encryption password for Match certificates
#    - MATCH_GIT_URL: URL of private Git repo for certificates
#    - MATCH_GIT_BASIC_AUTH: Base64 encoded "username:personal_access_token"
#    - MATCH_KEYCHAIN_NAME: Name for temporary keychain (e.g., "fastlane_keychain")
#    - MATCH_KEYCHAIN_PASSWORD: Password for temporary keychain
#
# 3. FIREBASE CONFIGURATION (Optional for unsigned, recommended for signed)
#    Choose ONE of three methods (in priority order):
#
#    METHOD 1 (RECOMMENDED): GoogleService-Info.plist
#    - GOOGLE_SERVICE_INFO_PLIST: Base64-encoded plist file
#    - Create: cat GoogleService-Info.plist | base64
#    - Simplest, fastest, single secret
#
#    METHOD 2: GCP Service Account Key
#    - GCP_SA_KEY: JSON service account key content
#    - Requires Firebase Admin permissions
#    - Programmatic access via gcloud
#
#    METHOD 3 (LEGACY): Individual Firebase Secrets
#    - Configure ALL 8 Firebase secrets separately:
#      FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_DATABASE_URL,
#      FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET, FIREBASE_MESSAGING_SENDER_ID,
#      FIREBASE_APP_ID, FIREBASE_MEASUREMENT_ID
#    - More tedious but maximum control
#
#    See: flutter_admin_app/GITHUB_SECRETS_SETUP.md for complete setup guide
#
# ============================================================================
# SETUP GUIDES
# ============================================================================
# UNSIGNED (Development):
#   See: flutter_admin_app/IOS_BUILD_SETUP.md → "Building Without Apple Developer Account"
#
# SIGNED (Production):
#   See: flutter_admin_app/IOS_BUILD_SETUP.md → Complete setup guide
#
# Quick start for SIGNED builds:
# 1. Set up Apple Developer account ($99/year)
# 2. Create App ID in Apple Developer Portal
# 3. Initialize Fastlane Match: `cd ios && bundle exec fastlane match init`
# 4. Configure GitHub Secrets (see above)
# 5. Push a tag: `git tag flutter-v1.0.0 && git push origin flutter-v1.0.0`
# ============================================================================
