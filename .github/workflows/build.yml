name: Build and Release Electron POS App

on:
  push:
    tags:
      - 'v*' # Triggers workflow on tag pushes starting with 'v' (e.g. v1.0.0)
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write # Grants permission to create releases and upload files

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # Cross-builds on all platforms to compile the respective native dependencies
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Dependencies (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libusb-1.0-0-dev libudev-dev

      - name: Clean Install Dependencies
        run: npm ci

      - name: Compile and Make Packages
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Installers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/make/**/*.exe
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
