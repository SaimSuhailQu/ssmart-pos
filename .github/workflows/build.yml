name: Build and Release Electron POS App

on:
  push:
    tags:
      - 'v*' # Triggers workflow on tag pushes starting with 'v' (e.g. v1.0.0)
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write # Grants permission to create releases and upload files

env:
  # Opt-in to Node 24 for runner actions to silence the Node 20 deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # Pin to windows-2022 for rock-solid Visual Studio 2022 compatibility with node-gyp
        os: [windows-2022, ubuntu-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python (Fix node-gyp for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Visual Studio Build Tools (Windows)
        if: matrix.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Install System Dependencies (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libusb-1.0-0-dev libudev-dev

      - name: Clean Install Dependencies
        run: npm ci --ignore-scripts
        
      - name: Rebuild Native Modules for Electron
        run: npx @electron/rebuild
        env:
          npm_config_msvs_version: ${{ matrix.os == 'windows-2022' && '2022' || '' }}

      - name: Inject Environment Secrets (.env)
        shell: bash
        run: |
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_WHATSAPP_PHONE_NUMBER_ID=${{ secrets.VITE_WHATSAPP_PHONE_NUMBER_ID }}
          VITE_WHATSAPP_ACCESS_TOKEN=${{ secrets.VITE_WHATSAPP_ACCESS_TOKEN }}
          EOF
          echo "Environment configuration generated."

      - name: Compile and Make Packages
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pos-distributables-${{ matrix.os }}
          path: |
            out/make/**/*.exe
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.nupkg
            out/make/**/RELEASES

      - name: Create Release and Upload Installers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/make/**/*.exe
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
